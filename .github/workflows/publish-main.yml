# Publishes ghcr.io/${GHCR_OWNER}/utopia:main on every push to main, so this
# fork's usual `/deploy-galaxy utopia` (universe CLAUDE.md, tag defaults to
# `main`) has an image to pull — upstream's own release.yml only tags on
# version tags (v*), which doesn't fit that convention.
name: Publish main

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha,format=long

      # Same rationale as release.yml: "the image built" doesn't prove "the
      # container boots" — a glibc mismatch between build and run stages is a
      # green build and a dead-on-arrival container.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: utopia:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — boot it, migrate, register a user
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=utopia -e POSTGRES_PASSWORD=utopia -e POSTGRES_DB=utopia \
            pgvector/pgvector:pg16
          for _ in $(seq 1 40); do
            if docker exec pg pg_isready -U utopia -d utopia >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker run -d --name app --network smoke -p 1516:1516 \
            -e UTOPIA_DATABASE_URL=postgres://utopia:utopia@pg:5432/utopia \
            utopia:smoke

          ok=""
          for _ in $(seq 1 40); do
            if curl -sf -m 3 http://localhost:1516/api/v1/health -o /tmp/h.json \
               && grep -q '"status":"ok"' /tmp/h.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "::error::container never became healthy"; docker logs app; exit 1; fi

          code=$(curl -s -o /tmp/reg.json -w '%{http_code}' -m 10 \
            -X POST http://localhost:1516/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-password-123","display_name":"Smoke"}')
          if [ "$code" != "200" ]; then
            echo "::error::register returned $code"; cat /tmp/reg.json; docker logs app; exit 1
          fi
          grep -q '"token"' /tmp/reg.json || { echo "::error::no token issued"; cat /tmp/reg.json; exit 1; }
          echo "smoke test passed: healthy, migrated, user registered, token issued"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
