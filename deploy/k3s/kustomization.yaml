apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workloads

resources:
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - data-pvc.yaml
  - app-deployment.yaml
  - app-service.yaml
  - ingress.yaml

images:
  # This fork's default branch is `main`, and .github/workflows/publish-main.yml
  # publishes that tag on every push to it -- pulsar's default tag also happens
  # to be `main`, but pin it explicitly here rather than relying on that match.
  - name: ghcr.io/luukjuh123/utopia
    newTag: main
